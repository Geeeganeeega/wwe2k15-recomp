<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WWE 2K15 – Launcher</title><style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#0d0002;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none} #s{position:absolute!important;left:50%;top:50%;transform-origin:center}
#s{position:relative;width:1088px;height:540px;overflow:hidden;font-family:Roboto,sans-serif;color:#fff;background:#140003}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:brightness(.62) saturate(1.15) contrast(1.05)}
.tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,0,4,.9) 0%,rgba(40,0,6,.72) 40%,rgba(48,0,8,.45) 70%,rgba(30,0,5,.6) 100%)}
.tint2{position:absolute;inset:0;background:rgba(110,0,12,.35);mix-blend-mode:multiply}
.tint3{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,0,3,.85) 0%,rgba(20,0,3,0) 45%)}
.cond{display:inline-block;transform:scaleX(.84);transform-origin:left center}
.title{position:absolute;left:49px;top:25px;padding:6px 10px 4px 2px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,0));}
.title span{font:italic 900 56px Roboto;letter-spacing:1px;line-height:1;background:linear-gradient(180deg,#fff 30%,#F6A3B0 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,120,140,.55))}
.sub{position:absolute;left:49px;top:104px;font:500 17px Roboto;letter-spacing:7.5px}
.ready{position:absolute;left:49px;top:139px;font:400 17px Roboto;color:#E8B8BC}
.pill{position:absolute;left:49px;width:41px;height:22px;border:1.5px solid rgba(255,255,255,.85);border-radius:7px;font:700 10px Roboto;display:flex;align-items:center;justify-content:center}
.home{position:absolute;left:105px;top:170px;font:900 46px Roboto;line-height:1}
.logo{position:absolute;right:52px;top:27px;padding:6px 10px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0))}
.logo span{font:italic 900 96px Roboto;line-height:1;background:linear-gradient(180deg,#fff 0%,#FF6F82 45%,#E8102A 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,40,70,.6))}
.made{position:absolute;right:52px;top:139px;font:700 13px Roboto;letter-spacing:5px}
.tile{position:absolute;width:221px;height:103px;border:1.5px solid rgba(255,255,255,.4);background:rgba(10,0,2,.38) repeating-linear-gradient(120deg,transparent 0 34px,rgba(255,255,255,.08) 34px 35px);backdrop-filter:blur(2px)}
.tile .lab{transform:scaleX(.84);transform-origin:left center;position:absolute;left:-1px;top:53px;height:31px;padding:0 9px;background:#fff;color:#111;font:700 20px Roboto;letter-spacing:1.5px;display:flex;align-items:center}
.tile svg{position:absolute;right:30px;top:20px;opacity:.42}
.hint{position:absolute;left:49px;top:490px;font:700 18px Roboto;letter-spacing:1px;display:flex;gap:28px;align-items:center}
.hint b{display:inline-flex;width:16px;height:16px;border:1.6px solid #fff;border-radius:50%;font:700 10px Roboto;align-items:center;justify-content:center;margin-right:8px;vertical-align:2px}
.ver{position:absolute;right:52px;top:483px;text-align:right;font:700 15px Roboto;line-height:1.15}
.tile{overflow:hidden;background:#1a0003 !important}
.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph+i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,0,4,.55) 0%,rgba(25,0,4,.1) 55%,rgba(25,0,4,0) 100%),linear-gradient(0deg,rgba(25,0,4,.45) 0%,rgba(25,0,4,0) 50%),repeating-linear-gradient(120deg,transparent 0 34px,rgba(255,255,255,.06) 34px 35px)}
.tile svg{right:10px !important;top:9px !important;width:20px;height:20px;opacity:.9 !important;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.tile .lab{z-index:2}
/* cooler tile labels */
.tile .ph+i{background:linear-gradient(0deg,rgba(18,0,3,.92) 0%,rgba(18,0,3,.35) 38%,rgba(18,0,3,0) 60%),linear-gradient(90deg,rgba(18,0,3,.45) 0%,rgba(18,0,3,0) 45%) !important}
.tile .lab{top:auto !important;bottom:10px;left:-10px !important;height:30px !important;padding:0 16px 0 20px !important;background:linear-gradient(90deg,#F0162F 0%,#B0081C 70%,#7A0412 100%) !important;color:#fff !important;transform:skewX(-14deg) !important;box-shadow:inset -3px 0 0 #fff,0 6px 16px rgba(0,0,0,.55);font:italic 900 19px Roboto !important;letter-spacing:1.2px !important}
.tile .lab span{display:inline-block;transform:skewX(14deg) scaleX(.86);transform-origin:left center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile .lab::after{content:"";position:absolute;left:20px;right:10px;bottom:-5px;height:2px;background:rgba(255,255,255,.85)}

/* motion */
.bg{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.title,.sub,.ready,.pill,.home,.logo,.made,.hint,.ver{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.logo,.made{animation-name:fadeIn;animation-delay:.25s}
.tile{cursor:pointer;opacity:0;animation:tileIn .5s cubic-bezier(.2,.8,.2,1) both;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),border-color .2s,box-shadow .2s}
.tile .ph{transition:transform .5s ease}
.tile.on{transform:scale(1.05);border-color:#fff!important;box-shadow:0 0 0 2px #F0162F,0 12px 30px rgba(0,0,0,.6),0 0 30px rgba(240,22,47,.45);z-index:3}
.tile.on .ph{transform:scale(1.08)}
.tile.press{transform:scale(.97)!important}
@keyframes tileIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1}}

/* no picture chosen: drawn blood-red art */
#s{background:radial-gradient(ellipse at 62% 42%,#b3000c 0%,#6a0006 38%,#140002 75%) !important}
#s::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,40,60,.10) 22px 24px,transparent 24px 60px);mask-image:linear-gradient(90deg,transparent 25%,#000 60%,transparent 95%);-webkit-mask-image:linear-gradient(90deg,transparent 25%,#000 60%,transparent 95%)}
.tile.noimg{background:linear-gradient(135deg,#8a0012 0%,#3a0006 55%,#140002 100%) !important}
.tile.noimg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 26px,rgba(255,255,255,.07) 26px 28px)}
.tile.noimg svg{width:44px !important;height:44px !important;right:22px !important;top:16px !important;opacity:.35 !important}
.tile.noimg.on svg{opacity:.8 !important}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:6px;font:500 15px Roboto;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style></head><body><div id="s">
<img class="bg" src="images/bg_home.jpg" onerror="this.remove()"><div class="tint"></div><div class="tint2"></div><div class="tint3"></div>
<div class="title"><span class="cond">WWE 2K15</span></div>
<div class="sub">ANDROID &nbsp;·&nbsp; RECOMPILED</div>
<div class="ready">READY TO PLAY</div>
<div class="pill" style="top:171px">L1</div><div class="pill" style="top:197px">R1</div>
<div class="home"><span class="cond" id="pageName">HOME</span></div>
<div class="logo"><span class="cond" style="transform-origin:right center">2K15</span></div>
<div class="made">MADE BY SHADOW XAVIER</div>
<button class="tile" data-id="play" aria-label="play" style="left:49px;top:243px;animation-delay:0.15s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_play.jpg" alt=""><i></i><svg width="50" height="50" viewBox="0 0 50 50"><path d="M5 2l42 23L5 48z" fill="#FFFFFF"/></svg><div class="lab"><span>PLAY</span></div></button>
<button class="tile" data-id="files" aria-label="files" style="left:287px;top:243px;animation-delay:0.20s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_files.jpg" alt=""><i></i><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="5"><rect x="3" y="3" width="42" height="42"/><path d="M3 15h42M3 25h42M3 35h42"/></svg><div class="lab"><span>GAME FILES</span></div></button>
<button class="tile" data-id="graphics" aria-label="graphics" style="left:525px;top:243px;animation-delay:0.25s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_graphics.jpg" alt=""><i></i><svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#FFFFFF" stroke-width="5"><path d="M25 3l22 22-22 22L3 25z"/><path d="M25 16l9 9-9 9-9-9z" fill="#FFFFFF"/></svg><div class="lab"><span>GRAPHICS</span></div></button>
<button class="tile" data-id="controls" aria-label="controls" style="left:763px;top:243px;animation-delay:0.30s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_controls.jpg" alt=""><i></i><svg width="58" height="58" viewBox="0 0 58 58"><path d="M20 0h18v20h20v18H38v20H20V38H0V20h20z" fill="#FFFFFF"/><rect x="22" y="22" width="14" height="14" fill="none"/></svg><div class="lab"><span>CONTROLS</span></div></button>
<button class="tile" data-id="game" aria-label="game" style="left:49px;top:364px;animation-delay:0.35s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_game.jpg" alt=""><i></i><svg width="66" height="64" viewBox="0 0 66 64"><path d="M33 2l9.5 21.5L65 25l-17 15 5 23-20-12-20 12 5-23L1 25l22.5-1.5z" fill="#FFFFFF"/></svg><div class="lab"><span>GAME</span></div></button>
<button class="tile" data-id="saves" aria-label="saves" style="left:287px;top:364px;animation-delay:0.40s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_saves.jpg" alt=""><i></i><svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="#FFFFFF" stroke-width="5"><path d="M9 14a21 21 0 1 0 8-8"/><path d="M5 4v12h12" stroke-linejoin="round"/></svg><div class="lab"><span>SAVES</span></div></button>
<button class="tile" data-id="logs" aria-label="logs" style="left:525px;top:364px;animation-delay:0.45s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_logs.jpg" alt=""><i></i><svg width="60" height="56" viewBox="0 0 60 56" fill="#FFFFFF"><rect x="0" y="2" width="60" height="8"/><rect x="0" y="24" width="60" height="8"/><rect x="0" y="46" width="60" height="8"/></svg><div class="lab"><span>LOGS</span></div></button>
<button class="tile" data-id="updates" aria-label="updates" style="left:763px;top:364px;animation-delay:0.50s;padding:0;color:inherit;font:inherit"><img class="ph" onerror="this.parentNode.classList.add('noimg');this.remove()" src="images/tile_updates.jpg" alt=""><i></i><svg width="30" height="56" viewBox="0 0 30 56"><path d="M12 0h6v40h10L15 56 2 40h10z" fill="#FFFFFF"/></svg><div class="lab"><span>UPDATES</span></div></button>

<div class="toast" id="toast"></div><div class="hint"><span><b>A</b><span class="cond">SELECT</span></span><span><b>B</b><span class="cond">QUIT</span></span><span><span class="cond">← → MOVE</span></span></div>
<div class="ver"><span class="cond" style="transform-origin:right center">v0.1.0-8</span><br><span class="cond" style="transform-origin:right center">ANDROID PORT</span></div>
</div><script>
/* ===== WWE 2K15 launcher logic (made by Shadow Xavier) ===== */
const tiles=[...document.querySelectorAll('.tile')]; let sel=0;
function select(i){ sel=(i+tiles.length)%tiles.length; tiles.forEach((t,k)=>t.classList.toggle('on',k===sel)); }
function activate(i){ const t=tiles[i]; t.classList.add('press'); setTimeout(()=>t.classList.remove('press'),140);
  const id=t.dataset.id;
  /* Android bridge: add a JavascriptInterface named "Android" */
  if(window.Android){ if(id==='play'&&Android.launchGame) Android.launchGame(); else if(Android.openSection) Android.openSection(id); }
  else console.log('open',id); }
tiles.forEach((t,k)=>{
  /* tap = open (a first tap on another tile also opens it: phones have no hover) */
  t.addEventListener('click',()=>{ if(t._long){t._long=false;return;} select(k); activate(k); });
  /* long-press = choose this tile's picture from the phone */
  let timer=null;
  t.addEventListener('touchstart',()=>{ timer=setTimeout(()=>{ t._long=true; if(window.Android&&Android.pickImage) Android.pickImage(t.dataset.id); },650); },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>t.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
  t.addEventListener('contextmenu',e=>e.preventDefault());
});
/* long-press the title or the 2K15 mark = choose the background picture */
['.title','.logo'].forEach(q=>{ const el=document.querySelector(q); let tm=null;
  el.addEventListener('touchstart',()=>{ tm=setTimeout(()=>{ if(window.Android&&Android.pickImage) Android.pickImage('bg'); },650); },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(tm),{passive:true})); });
window.toast=m=>{ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); };
/* Controller / keys: arrows move (also up/down between rows), Enter = A, Escape = B, Q/E = L1/R1 */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight') select(sel+1); else if(k==='ArrowLeft') select(sel-1);
  else if(k==='ArrowDown') select(sel<4?sel+4:sel); else if(k==='ArrowUp') select(sel>=4?sel-4:sel);
  else if(k==='Enter'||k===' ') activate(sel);
  else if(k==='Escape'||k==='Backspace'){ if(window.Android&&Android.quit) Android.quit(); }
  else if(k==='q'||k==='PageUp'){ if(window.Android&&Android.prevPage) Android.prevPage(); }
  else if(k==='e'||k==='PageDown'){ if(window.Android&&Android.nextPage) Android.nextPage(); }
});
/* Android can update text: setInfo({ready:'READY TO PLAY', version:'v0.1.0-8', page:'HOME'}) */
window.setInfo=v=>{ if(v.ready) document.querySelector('.ready').textContent=v.ready;
  if(v.page) document.getElementById('pageName').textContent=v.page;
  if(v.version) document.querySelector('.ver span').textContent=v.version; if(v.toast) toast(v.toast); };
/* Fit 1088x540 design to any landscape screen */
function fit(){ const sc=Math.min(innerWidth/1088,innerHeight/540); document.getElementById('s').style.transform=`translate(-50%,-50%) scale(${sc})`; }
addEventListener('resize',fit); fit(); select(0);
</script></body></html>
